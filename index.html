<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HijraPlan - Premium 3D Muslim Planner</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 100%);
            background-attachment: fixed;
            color: #ffffff; 
        }
        .font-arabic { font-family: 'Amiri', serif; }
        .card-3d { 
            background: rgba(30, 58, 138, 0.35);
            border: 1px solid rgba(255, 255, 255, 0.12); 
            box-shadow: 0 10px 25px -5px rgba(2, 6, 23, 0.5);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .card-3d:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 30px -5px rgba(59, 130, 246, 0.25);
        }
        .btn-3d-amber {
            background: linear-gradient(135deg, #fbbf24 0%, #d97706 100%);
            box-shadow: 0 4px 12px rgba(217, 119, 6, 0.4);
        }
        .btn-3d-emerald {
            background: linear-gradient(135deg, #34d399 0%, #059669 100%);
            box-shadow: 0 4px 12px rgba(5, 150, 105, 0.4);
        }
        .btn-3d-purple {
            background: linear-gradient(135deg, #a78bfa 0%, #6d28d9 100%);
            box-shadow: 0 4px 12px rgba(109, 40, 217, 0.4);
        }
        .text-glow-white { text-shadow: 0 0 10px rgba(255, 255, 255, 0.5); }
        .text-glow-blue { text-shadow: 0 0 12px rgba(96, 165, 250, 0.6); }

        /* ANIMASI SPLASH SCREEN HALUS */
        @keyframes fadeInOut {
            0% { opacity: 0; transform: scale(0.95); }
            50% { opacity: 1; transform: scale(1); }
            100% { opacity: 0; visibility: hidden; }
        }
        .splash-animation {
            animation: fadeInOut 1.5s ease-in-out forwards;
        }
    </style>
</head>
<body class="min-h-screen pb-16 flex flex-col justify-between">

    <!-- SPLASH SCREEN / ANIMASI LOGO H DI AWAL -->
    <div id="splash-screen" class="fixed inset-0 z-50 flex flex-col items-center justify-center bg-slate-950 splash-animation">
        <div class="w-24 h-24 rounded-3xl btn-3d-amber flex items-center justify-center text-slate-950 font-black text-5xl shadow-2xl">
            H
        </div>
        <h1 class="text-3xl font-black text-white text-glow-white mt-5 tracking-wide">HijraPlan</h1>
        <a href="https://instagram.com/takutdosa.id" target="_blank" class="text-xs text-amber-300 font-bold tracking-widest mt-2">BY @TAKUTDOSA.ID</a>
    </div>

    <!-- AUTH SECTION (LOGIN / REGISTER) -->
    <div id="auth-container" class="fixed inset-0 z-40 flex items-center justify-center p-4 bg-slate-950/95 hidden">
        <div class="max-w-md w-full card-3d p-6 rounded-3xl space-y-6 border border-white/20 shadow-2xl bg-slate-900/90">
            <div class="text-center space-y-2">
                <div class="w-14 h-14 mx-auto rounded-2xl btn-3d-amber flex items-center justify-center text-slate-950 font-black text-3xl shadow-lg">
                    H
                </div>
                <h1 class="text-2xl font-black text-white text-glow-white">HijraPlan</h1>
                <a href="https://instagram.com/takutdosa.id" target="_blank" class="inline-block text-[10px] text-amber-300 font-bold tracking-wider hover:underline">BY @TAKUTDOSA.ID <i class="fa-solid fa-arrow-up-right-from-square text-[8px] ml-0.5"></i></a>
                <p id="auth-subtitle" class="text-xs text-blue-200/80 pt-1">Silakan masuk atau daftar akun terlebih dahulu</p>
            </div>

            <!-- FORM LOGIN -->
            <form id="form-login" onsubmit="handleLogin(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-blue-200 mb-1">Email Pengguna</label>
                    <input type="email" id="login-email" required placeholder="nama@email.com" 
                        class="w-full bg-slate-950 border border-white/20 rounded-xl px-4 py-3 text-xs text-white placeholder-blue-300/40 focus:outline-none focus:border-amber-400">
                </div>
                <div>
                    <label class="block text-xs font-bold text-blue-200 mb-1">Kata Sandi</label>
                    <input type="password" id="login-password" required placeholder="••••••••" 
                        class="w-full bg-slate-950 border border-white/20 rounded-xl px-4 py-3 text-xs text-white placeholder-blue-300/40 focus:outline-none focus:border-amber-400">
                </div>
                <button type="submit" class="w-full btn-3d-amber text-slate-950 font-black py-3 rounded-xl text-sm transition-transform active:scale-95">
                    Masuk ke Aplikasi
                </button>
                <p class="text-center text-xs text-blue-200/70 pt-2">
                    Belum punya akun? <span onclick="toggleAuthMode('register')" class="text-amber-300 font-bold cursor-pointer underline">Daftar di sini</span>
                </p>
            </form>

            <!-- FORM REGISTER -->
            <form id="form-register" onsubmit="handleRegister(event)" class="space-y-4 hidden">
                <div>
                    <label class="block text-xs font-bold text-blue-200 mb-1">Nama Panggilan / Nickname</label>
                    <input type="text" id="reg-nickname" required placeholder="Contoh: Ahmad / Fulan" 
                        class="w-full bg-slate-950 border border-white/20 rounded-xl px-4 py-3 text-xs text-white placeholder-blue-300/40 focus:outline-none focus:border-emerald-400">
                </div>
                <div>
                    <label class="block text-xs font-bold text-blue-200 mb-1">Email</label>
                    <input type="email" id="reg-email" required placeholder="nama@email.com" 
                        class="w-full bg-slate-950 border border-white/20 rounded-xl px-4 py-3 text-xs text-white placeholder-blue-300/40 focus:outline-none focus:border-emerald-400">
                </div>
                <div>
                    <label class="block text-xs font-bold text-blue-200 mb-1">Buat Kata Sandi Baru</label>
                    <input type="password" id="reg-password" required placeholder="••••••••" 
                        class="w-full bg-slate-950 border border-white/20 rounded-xl px-4 py-3 text-xs text-white placeholder-blue-300/40 focus:outline-none focus:border-emerald-400">
                </div>
                <button type="submit" class="w-full btn-3d-emerald text-slate-950 font-black py-3 rounded-xl text-sm transition-transform active:scale-95">
                    Daftar Akun
                </button>
                <p class="text-center text-xs text-blue-200/70 pt-2">
                    Sudah punya akun? <span onclick="toggleAuthMode('login')" class="text-emerald-300 font-bold cursor-pointer underline">Masuk di sini</span>
                </p>
            </form>
        </div>
    </div>

    <!-- HEADER UTAMA APLIKASI -->
    <header class="sticky top-0 z-30 card-3d border-b border-white/10 px-4 py-3.5 mb-6 rounded-b-2xl bg-slate-900/80">
        <div class="max-w-md mx-auto flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="w-11 h-11 rounded-2xl btn-3d-amber flex items-center justify-center text-slate-950 font-black text-xl">
                    H
                </div>
                <div>
                    <div class="flex items-center gap-2">
                        <h1 class="font-extrabold text-sm leading-tight tracking-wide text-white text-glow-blue">HijraPlan</h1>
                        <a href="https://instagram.com/takutdosa.id" target="_blank" class="bg-amber-400/20 text-amber-300 text-[9px] font-bold px-2 py-0.5 rounded border border-amber-400/30 hover:bg-amber-400/30 transition-colors">by@takutdosa.id</a>
                    </div>
                    <p class="text-[11px] text-blue-200 font-medium mt-0.5" id="user-display-name">Ahlan wa Sahlan</p>
                    <p class="text-[9px] text-red-400/80 font-semibold cursor-pointer hover:underline mt-0.5" onclick="logout()">Keluar Akun <i class="fa-solid fa-right-from-bracket ml-0.5"></i></p>
                </div>
            </div>
            <div class="bg-slate-950 px-3.5 py-1.5 rounded-full text-xs font-bold text-amber-300 border border-amber-400/30 shadow-inner">
                <i class="fa-solid fa-star text-amber-400 mr-1"></i> <span id="total-points">0</span> Hasanah
            </div>
        </div>
    </header>

    <!-- MAIN APP CONTENT -->
    <main class="max-w-md mx-auto px-4 w-full">
        <!-- VIEW 1: BERANDA -->
        <div id="view-home" class="space-y-5">
            <div class="text-center py-2 mb
